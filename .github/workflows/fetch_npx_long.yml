name: fetch-npx-long-slice
# Fetches T0..T0+DUR seconds of the UCL Hopkins_20160722 Neuropixels recording (only the mtscomp chunks that
# cover it), decompresses them, trims the Kilosort output to the same window, and publishes both as assets of a
# GitHub Release (git cannot hold a 1.4 GB file). Run from the Actions tab: "Run workflow", set t0 and dur.
on:
  workflow_dispatch:
    inputs:
      t0:
        description: start time in seconds
        default: "10"
      dur:
        description: duration in seconds
        default: "60"
  push:
    paths:
      - .github/workflows/fetch_npx_long.yml      # committing this file runs it once with the defaults (t0 10, dur 60)
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      T0: ${{ github.event.inputs.t0 || '10' }}
      DUR: ${{ github.event.inputs.dur || '60' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mtscomp requests numpy tqdm
      - name: fetch and decompress the slice, trim the Kilosort output
        run: |
          python - <<'EOF'
          import requests, json, os, glob, zipfile, numpy as np, mtscomp
          B = "https://ndownloader.figshare.com/files/"
          def get(fid, name): open(name, "wb").write(requests.get(B + fid, allow_redirects=True).content)
          os.makedirs("out", exist_ok=True); os.chdir("out")
          get("44738764", "raw.ch"); get("44571769", "raw.meta"); get("44571760", "cluster_groups.csv")
          get("44571757", "channel_positions.npy"); get("44571754", "channel_map.npy"); get("44571844", "dataset.zip")
          ch = json.load(open("raw.ch")); off = ch["chunk_offsets"]; bounds = ch["chunk_bounds"]
          T0, DUR = int(os.environ["T0"]), int(os.environ["DUR"])
          i0 = next(i for i, b in enumerate(bounds) if b > T0 * 30000) - 1
          i1 = next(i for i, b in enumerate(bounds) if b >= (T0 + DUR) * 30000)
          i1 = min(i1, len(bounds) - 1)
          f = open("raw.cbin", "wb"); f.truncate(off[-1]); f.seek(off[i0])
          r = requests.get(B + "44739280", headers={"Range": "bytes=%d-%d" % (off[i0], off[min(i1 + 1, len(off) - 1)] - 1)}, allow_redirects=True, stream=True)
          for c in r.iter_content(1 << 20): f.write(c)
          f.close()
          rd = mtscomp.Reader(); rd.open("raw.cbin", "raw.ch")
          s0, s1 = int(bounds[i0]), int(bounds[i1])
          with open("slice.bin", "wb") as o:
              for a in range(s0, s1, 30000 * 5):        # 5 s pieces keep memory small
                  np.asarray(rd[a:min(a + 30000 * 5, s1)], dtype=np.int16).tofile(o)
          os.remove("raw.cbin")
          n = os.path.getsize("slice.bin") // (2 * 385)
          json.dump({"start_sample": s0, "n_samples": int(n), "n_channels": 385, "t0_s": T0, "dur_s": DUR,
                     "chunk_first": i0, "chunk_last": i1}, open("slice.json", "w"))
          zipfile.ZipFile("dataset.zip").extractall("ks_full"); os.remove("dataset.zip")
          src = os.path.dirname(glob.glob("ks_full/**/spike_times.npy", recursive=True)[0]); os.makedirs("ks", exist_ok=True)
          st = np.load(os.path.join(src, "spike_times.npy")).ravel(); m = (st >= s0 - 100) & (st < s1 + 100)
          for nm in ("spike_times", "spike_clusters", "spike_templates", "amplitudes"):
              p = os.path.join(src, nm + ".npy")
              if os.path.exists(p): np.save(os.path.join("ks", nm + ".npy"), np.load(p).ravel()[m])
          for nm in ("templates.npy", "channel_positions.npy", "channel_map.npy", "params.py", "cluster_groups.csv", "cluster_group.tsv", "templates_ind.npy", "whitening_mat.npy", "whitening_mat_inv.npy"):
              p = os.path.join(src, nm)
              if os.path.exists(p) and os.path.getsize(p) < 90e6: os.replace(p, os.path.join("ks", nm))
          import shutil; shutil.rmtree("ks_full")
          print("samples", n, "start", s0, "spikes in window", int(m.sum()), sorted(os.listdir("ks")))
          EOF
          cd out && gzip -1 slice.bin && tar czf ks.tgz ks raw.ch raw.meta cluster_groups.csv channel_positions.npy channel_map.npy slice.json && ls -la
      - name: publish as a release
        run: |
          TAG=slice-${T0}s-${DUR}s
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/slice.bin.gz out/ks.tgz out/slice.json \
            --title "UCL Hopkins_20160722 slice t=${T0}-$((T0+DUR)) s" \
            --notes "int16 [n_samples x 385] raw ADC codes (CAR'd, 2.34 uV/LSB), gzip -1; ks.tgz = Kilosort output trimmed to the window + channel files."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
